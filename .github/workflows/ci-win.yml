name: Continuous Integration Windows

on: [pull_request]

jobs:

  build:
    runs-on: windows-latest

    strategy:
      matrix:
        node: [24, 26]

    steps:
    - uses: actions/checkout@v6
      name: Use Node.js ${{ matrix.node }}
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
    - name: Installing project dependencies
      run: |
        npm ci
    - name: Build
      run: |
        npm run build